# AbstractFurnaceBlockEntity's burn timer.
#
# FuelHubBlockEntity writes to it directly, which is the whole point of the block: a linked
# furnace runs with an empty fuel slot because its fuel lives in the hub instead. Feeding the
# furnace items through its container would work without this, but then it would just be a
# hopper, and the fuel would be visible in the wrong place.
public net.minecraft.world.level.block.entity.AbstractFurnaceBlockEntity litTimeRemaining
public net.minecraft.world.level.block.entity.AbstractFurnaceBlockEntity litTotalTime
